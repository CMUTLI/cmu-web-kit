default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npm run lint
        language: system
        pass_filenames: false
      - id: prettier
        name: Prettier
        entry: npm run format:check
        language: system
        pass_filenames: false
      - id: versions
        name: Versions in the docs and README
        entry: npm run check:versions
        language: system
        pass_filenames: false
        files: ^(package\.json|README\.md|docs/.*\.html)$
      - id: components
        name: Components table
        entry: npm run check:components
        language: system
        pass_filenames: false
        files: ^docs/.*\.html$
